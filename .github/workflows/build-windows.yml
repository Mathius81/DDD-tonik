name: Build Windows installer

# Pornește automat la fiecare push pe master și poate fi pornit manual pe ORICE
# ramură, din Actions → „Run workflow” → alegi ramura. Manual e util ca să obții
# un installer dintr-o ramură de lucru, fără s-o duci întâi în master.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalează dependențele
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificare de tipuri
        run: npm run typecheck

      - name: Teste
        run: npm test

      - name: Construiește installerul
        run: npm run make

      # Numele include numărul rulării, ca să nu se amestece build-urile între ele
      # când descarci mai multe. Installerul se ia din secțiunea „Artifacts”.
      # 90 de zile de păstrare (implicit sunt doar 30).
      - name: Publică installerul
        uses: actions/upload-artifact@v4
        with:
          name: DDDManager-Setup-${{ github.run_number }}
          path: out/make/squirrel.windows/x64/*.exe
          if-no-files-found: error
          retention-days: 90
